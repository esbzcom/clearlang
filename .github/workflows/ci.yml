name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked
      - name: Release precheck gate (fmt + lint + tests)
        run: cargo run -p xtask -- release-precheck
      - name: SDK usability gates
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test cli_it sdk_usability_
          cargo test -p clg-cli --test cli_it migration_
          cargo test -p clg-cli --test cli_it imports::
      - name: Strict gate acceptance suite
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test cli_it strict_acceptance_
      - name: IDE CLI contract gates
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test ide_cli_contract
      - name: Milestone 4 contract release workflow gates
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test cli_it basic::build_emits_stateful_evm_artifact_with_schema_bound_slots_and_transitions
          cargo test -p clg-cli --test cli_it basic::contract_test_campaign_is_seeded_replayable_and_captures_simulator_traces
          cargo test -p clg-cli --test cli_it basic::contract_release_help_exposes_the_complete_evidence_contract
          cargo test -p clg-cli --test cli_it basic::build_checks_contract_state_schema_is_append_only
          cargo test -p clg-cli --test cli_it basic::build_rejects_adversarial_contract_external_call_without_an_adapter
          cargo test -p clg-cli --test cli_it basic::target_commands_require_explicit_configuration_and_deploy_signing_policy
          cargo test -p clg-cli --test cli_it basic::target_invoke_requires_explicit_signing_sender_value_and_gas_policy
          cargo test -p clg-cli --lib commands::target::tests::deploy_signs_submits_and_writes_confirmed_receipt
          cargo test -p clg-cli --lib commands::target::tests::invoke_signs_submits_and_writes_confirmed_receipt
          cargo test -p clg-cli --lib commands::target::tests::cross_artifact_compiler_drift_is_rejected_before_submission
          cargo test -p clg-typer --test contract_state contract_external_calls_enforce_checks_effects_interactions
      - name: Proof regression gates
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test vc_snapshots
          cargo test -p clg-cli --test solver_outcomes
          cargo test -p clg-cli --test solver_replay_stability
          cargo test -p clg-cli --features rust-z3-lib --test solver_backend_parity
          cargo test -p clg-cli --features rust-z3-lib --test solver_rust_cutover_packaging
          cargo test -p clg-cli --test phase25_solver_support_matrix
          cargo test -p clg-cli --test phase25_solver_supply_chain_gate
          cargo test -p clg-cli --test phase25_crypto_release_closure
          cargo test -p clg-cli --test phase25_production_cutover_policy
          cargo test -p clg-cli --test phase25_gate_b_closure_metric
          cargo test -p clg-cli --test proof_artifact_replay
          cargo test -p clg-cli --test prefixed_literal_parity
          cargo test -p clg-cli --test proof_coverage_matrix
          cargo test -p clg-cli --test verified_std_core_subset
          cargo test -p clg-cli --test profile_regression_gate
          cargo test -p clg-cli --test milestone3_release_gate
          cargo test -p clg-cli --test milestone3_proof_parity
          cargo test -p clg-cli --test signing verify_require_assurance_rejects_manifest_with_assumption_boundaries_when_proved_all
          cargo test -p clg-cli --test signing verify_require_assurance_rejects_symbols_outside_proved_allowlist_when_proved_all
          cargo test -p clg-cli --test cli_it diagnostics::production_release_profile_requires_proved_all_with_c121
          cargo test -p clg-cli --test solver_outcomes missing_solver_binary_keeps_generated_status
          cargo test -p clg-cli --test cli_it diagnostics::production_release_profile_rejects_non_proved_std_surface_with_c122
          cargo test -p clg-cli --test cli_it diagnostics::production_release_profile_rejects_crypto_assumption_boundary_with_c123
          cargo test -p clg-cli --test cli_it parse_rejects_theorem_keyword_with_explicit_code
          cargo test -p clg-cli --test cli_it vc_outputs::build_emits_assumption_boundaries_in_vc_json_and_proof_section
          cargo test -p clg-typer --test vc declares_bitwise_and_builtin_helpers
          cargo test -p clg-typer --test vc vc_smt_declares_parameters_with_sorts_and_closes_let_locals
      - name: Release build
        run: cargo build --release -p clg-cli
      - name: Milestone 2 performance budgets
        run: |
          set -euo pipefail
          cargo run -p xtask -- milestone2-perf-gate
      - name: Std-core artifact reproducibility
        run: |
          set -euo pipefail
          rm -rf tmp/std-core
          cargo run -p xtask -- std-core-artifact --version 1.0.0 --out-dir tmp/std-core/run1
          cargo run -p xtask -- std-core-artifact --version 1.0.0 --out-dir tmp/std-core/run2
          cmp --silent tmp/std-core/run1/std-core-1.0.0.wasm tmp/std-core/run2/std-core-1.0.0.wasm
          cmp --silent tmp/std-core/run1/std-core-1.0.0.surface.json tmp/std-core/run2/std-core-1.0.0.surface.json
          cmp --silent tmp/std-core/run1/std-core-1.0.0.package-metadata.json tmp/std-core/run2/std-core-1.0.0.package-metadata.json
          cmp --silent tmp/std-core/run1/std-core-1.0.0.package-abi.json tmp/std-core/run2/std-core-1.0.0.package-abi.json
          cmp --silent tmp/std-core/run1/std-core-1.0.0.manifest.json tmp/std-core/run2/std-core-1.0.0.manifest.json
          cmp --silent tmp/std-core/run1/std-core-1.0.0.sha256 tmp/std-core/run2/std-core-1.0.0.sha256
      - name: Std architecture catalog sync + conformance determinism
        run: |
          set -euo pipefail
          rm -rf tmp/std-arch
          cargo run -p xtask -- std-arch-sync --emit-artifact tmp/std-arch/run1
          cargo run -p xtask -- std-arch-sync --emit-artifact tmp/std-arch/run2
          cmp --silent tmp/std-arch/run1/std-metadata-v2.json tmp/std-arch/run2/std-metadata-v2.json
          cmp --silent tmp/std-arch/run1/std-builtin-signatures-v1.json tmp/std-arch/run2/std-builtin-signatures-v1.json
          cmp --silent tmp/std-arch/run1/std-arch-artifacts.sha256 tmp/std-arch/run2/std-arch-artifacts.sha256
          cargo run -p xtask -- std-arch-conformance-check
      - name: Host capability policy determinism
        run: |
          set -euo pipefail
          rm -rf tmp/host-policy
          cargo run -p xtask -- host-capability-policy-artifact --emit-artifact tmp/host-policy/run1
          cargo run -p xtask -- host-capability-policy-artifact --emit-artifact tmp/host-policy/run2
          cmp --silent tmp/host-policy/run1/host-capability-policy-v1.json tmp/host-policy/run2/host-capability-policy-v1.json
          cmp --silent tmp/host-policy/run1/host-capability-policy-v1.sha256 tmp/host-policy/run2/host-capability-policy-v1.sha256
      - name: Milestone 2 supply-chain compliance gate
        run: |
          set -euo pipefail
          cargo run -p xtask -- milestone2-supply-chain-gate
      - name: Gate self-tests
        run: |
          set -euo pipefail
          cargo run -p xtask -- milestone2-supply-chain-gate --self-test
          cargo run -p xtask -- milestone2-perf-gate --self-test
      - name: Upload std-core artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: std-core-1.0.0
          path: tmp/std-core/run1/*
      - name: Upload host capability policy artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-capability-policy-v1
          path: tmp/host-policy/run1/*
      - name: Upload std architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: std-architecture-v1
          path: tmp/std-arch/run1/*
      - name: Upload milestone_2 performance artifact
        uses: actions/upload-artifact@v4
        with:
          name: milestone2-performance
          path: tmp/perf/*
      - name: Upload milestone_2 supply-chain artifact
        uses: actions/upload-artifact@v4
        with:
          name: milestone2-supply-chain
          path: tmp/sbom/*
      - name: Validate emitted Wasm
        run: |
          set -euo pipefail
          mkdir -p tmp/ci
          samples=(
            01_hello.clear
            02_arith.clear
            03_nested_calls.clear
            04_multiline_call.clear
            05_trailing_param_comma.clear
            08_main_const.clear
            18_return_simple.clear
          )
          for sample in "${samples[@]}"; do
            out="tmp/ci/${sample%.clear}.wasm"
            cargo run -p clg-cli -- build "clearlang-tests/${sample}" -o "${out}"
            wasm-tools validate "${out}"
          done
          cargo run -p clg-cli -- run clearlang-tests/16_namespaced_call.clear
          cargo run -p clg-cli -- emit-hello -o tmp/ci/emit_hello.wasm
          wasm-tools validate tmp/ci/emit_hello.wasm

  milestone2-perf-portability-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked
      - name: Release build
        run: cargo build --release -p clg-cli
      - name: Perf gate portability smoke (Git Bash)
        run: |
          cargo run -p xtask -- milestone2-perf-gate --portability-smoke
      - name: Perf gate self-test (Git Bash)
        run: |
          cargo run -p xtask -- milestone2-perf-gate --self-test
      - name: Perf gate full run (Git Bash)
        run: |
          $env:PERF_SAMPLE_RUNS = "1"
          cargo run -p xtask -- milestone2-perf-gate

  strict-determinism-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Strict preflight replay determinism gates
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test cli_it strict_acceptance_diagnostics_order_is_deterministic_across_identical_runs
          cargo test -p clg-cli --test cli_it strict_acceptance_import_map_artifact_is_deterministic_across_identical_runs

  resolver-determinism-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Resolver/solver replay determinism gates
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test cli_it pkg_lock_replay_with_identical_inputs_is_byte_identical
          cargo test -p clg-cli --test cli_it pkg_lock_diagnostics_output_is_deterministic_across_identical_runs

  runtime-loader-determinism-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Runtime loader tamper + replay determinism gates
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test run_smoke runtime_loader_tamper_
          cargo test -p clg-cli --test run_smoke runtime_loader_replay_

  milestone2-regression-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Milestone 2 cross-phase regression gate (Phase 20-24)
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test profile_regression_gate
          cargo test -p clg-cli --test cli_it strict_acceptance_
          cargo test -p clg-cli --test cli_it pkg_lock_diagnostics_output_is_deterministic_across_identical_runs
          cargo test -p clg-cli --test run_smoke runtime_loader_replay_
          CLG_ENFORCE_MILESTONE2_RELEASE_GATE=1 cargo test -p clg-cli --test milestone2_release_train_gate
          cargo test -p clg-cli --test host_conformance_certification

  milestone2-release-train-gate:
    if: startsWith(github.ref, 'refs/tags/milestone_2')
    needs:
      - checks
      - milestone2-perf-portability-smoke
      - strict-determinism-replay
      - resolver-determinism-replay
      - runtime-loader-determinism-replay
      - milestone2-regression-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Enforce milestone_2 release-train checklist gate
        env:
          CLG_ENFORCE_MILESTONE2_RELEASE_GATE: "1"
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test milestone2_release_train_gate

  milestone3-release-train-gate:
    if: startsWith(github.ref, 'refs/tags/milestone_3')
    needs:
      - checks
      - milestone3-proof-parity
      - milestone3-proof-parity-compare
      - milestone3-test-parity-compare
      - milestone3-binary-repro-compare
      - milestone3-binary-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Enforce milestone_3 proof/evidence release gate
        env:
          CLG_ENFORCE_MILESTONE3_RELEASE_GATE: "1"
        run: |
          set -euo pipefail
          cargo test -p clg-cli --test milestone3_release_gate

  milestone3-proof-parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Solver vendor-path smoke gate
        run: cargo test -p clg-cli --test solver_outcomes bundled_solver_root_is_used_when_solver_env_not_set
      - name: Rust backend parity gate (release-target)
        run: cargo test -p clg-cli --features rust-z3-lib --test solver_backend_parity
      - name: Rust cutover packaging gate (release-target)
        run: cargo test -p clg-cli --features rust-z3-lib --test solver_rust_cutover_packaging
      - name: Milestone 3 proof parity snapshot
        env:
          CLG_PROOF_PARITY_OUT: tmp/proof-parity/${{ matrix.platform }}.json
        run: cargo test -p clg-cli --test milestone3_proof_parity -- --nocapture
      - name: Upload milestone_3 proof parity artifact (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: milestone3-proof-parity-${{ matrix.platform }}
          path: tmp/proof-parity/${{ matrix.platform }}.json

  milestone3-proof-parity-compare:
    needs:
      - milestone3-proof-parity
    runs-on: ubuntu-latest
    steps:
      - name: Download milestone_3 proof parity artifact (windows)
        uses: actions/download-artifact@v4
        with:
          name: milestone3-proof-parity-windows
          path: tmp/proof-parity/windows
      - name: Download milestone_3 proof parity artifact (linux)
        uses: actions/download-artifact@v4
        with:
          name: milestone3-proof-parity-linux
          path: tmp/proof-parity/linux
      - name: Download milestone_3 proof parity artifact (macos)
        uses: actions/download-artifact@v4
        with:
          name: milestone3-proof-parity-macos
          path: tmp/proof-parity/macos
      - name: Compare milestone_3 proof parity artifacts
        run: |
          set -euo pipefail
          cmp --silent tmp/proof-parity/windows/windows.json tmp/proof-parity/linux/linux.json
          cmp --silent tmp/proof-parity/windows/windows.json tmp/proof-parity/macos/macos.json

  milestone3-test-parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Milestone 3 clg test parity snapshot
        env:
          CLG_TEST_PARITY_OUT: tmp/test-parity/${{ matrix.platform }}.json
        run: cargo test -p clg-cli --test milestone3_test_parity -- --nocapture
      - name: Upload milestone_3 clg test parity artifact (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: milestone3-test-parity-${{ matrix.platform }}
          path: tmp/test-parity/${{ matrix.platform }}.json

  milestone3-test-parity-compare:
    needs:
      - milestone3-test-parity
    runs-on: ubuntu-latest
    steps:
      - name: Download milestone_3 clg test parity artifact (windows)
        uses: actions/download-artifact@v4
        with:
          name: milestone3-test-parity-windows
          path: tmp/test-parity/windows
      - name: Download milestone_3 clg test parity artifact (linux)
        uses: actions/download-artifact@v4
        with:
          name: milestone3-test-parity-linux
          path: tmp/test-parity/linux
      - name: Download milestone_3 clg test parity artifact (macos)
        uses: actions/download-artifact@v4
        with:
          name: milestone3-test-parity-macos
          path: tmp/test-parity/macos
      - name: Compare milestone_3 clg test parity artifacts
        run: |
          set -euo pipefail
          cmp --silent tmp/test-parity/windows/windows.json tmp/test-parity/linux/linux.json
          cmp --silent tmp/test-parity/windows/windows.json tmp/test-parity/macos/macos.json

  milestone3-binary-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build clg release binary
        run: cargo build --release -p clg-cli
      - name: Binary help smoke
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          target/release/clg --help
          target/release/clg release --help
          target/release/clg verify-bundle --help
      - name: Binary help smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\target\release\clg.exe --help
          .\target\release\clg.exe release --help
          .\target\release\clg.exe verify-bundle --help
      - name: Emit signed binary bundle artifact (${{ matrix.platform }})
        env:
          # Test fixture key for CI smoke artifacts only (not production release signing material).
          CLG_BINARY_RELEASE_SIGNING_KEY_HEX: "1111111111111111111111111111111111111111111111111111111111111111"
        run: cargo run -p xtask -- milestone3-binary-bundle --platform ${{ matrix.platform }} --out-dir tmp/milestone3-binary/${{ matrix.platform }}
      - name: Verify signed binary bundle contract (${{ matrix.platform }})
        run: cargo run -p xtask -- milestone3-binary-bundle-verify --bundle-dir tmp/milestone3-binary/${{ matrix.platform }}
      - name: Upload milestone_3 signed binary bundle artifact (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: milestone3-binary-bundle-${{ matrix.platform }}
          path: tmp/milestone3-binary/${{ matrix.platform }}/*

  milestone3-binary-repro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            lane: a
          - os: windows-latest
            platform: windows
            lane: b
          - os: ubuntu-latest
            platform: linux
            lane: a
          - os: ubuntu-latest
            platform: linux
            lane: b
          - os: macos-latest
            platform: macos
            lane: a
          - os: macos-latest
            platform: macos
            lane: b
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Emit binary reproducibility witness (${{ matrix.platform }}-${{ matrix.lane }})
        run: cargo run -p xtask -- binary-repro-witness --out tmp/binary-repro/${{ matrix.platform }}-${{ matrix.lane }}.json
      - name: Upload binary reproducibility witness (${{ matrix.platform }}-${{ matrix.lane }})
        uses: actions/upload-artifact@v4
        with:
          name: milestone3-binary-repro-${{ matrix.platform }}-${{ matrix.lane }}
          path: tmp/binary-repro/${{ matrix.platform }}-${{ matrix.lane }}.json

  milestone3-binary-repro-compare:
    needs:
      - milestone3-binary-repro
    runs-on: ubuntu-latest
    steps:
      - name: Download binary witness windows-a
        uses: actions/download-artifact@v4
        with:
          name: milestone3-binary-repro-windows-a
          path: tmp/binary-repro/windows-a
      - name: Download binary witness windows-b
        uses: actions/download-artifact@v4
        with:
          name: milestone3-binary-repro-windows-b
          path: tmp/binary-repro/windows-b
      - name: Download binary witness linux-a
        uses: actions/download-artifact@v4
        with:
          name: milestone3-binary-repro-linux-a
          path: tmp/binary-repro/linux-a
      - name: Download binary witness linux-b
        uses: actions/download-artifact@v4
        with:
          name: milestone3-binary-repro-linux-b
          path: tmp/binary-repro/linux-b
      - name: Download binary witness macos-a
        uses: actions/download-artifact@v4
        with:
          name: milestone3-binary-repro-macos-a
          path: tmp/binary-repro/macos-a
      - name: Download binary witness macos-b
        uses: actions/download-artifact@v4
        with:
          name: milestone3-binary-repro-macos-b
          path: tmp/binary-repro/macos-b
      - name: Compare binary reproducibility witnesses per platform
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def read(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          pairs = [
              ("windows", "tmp/binary-repro/windows-a/windows-a.json", "tmp/binary-repro/windows-b/windows-b.json"),
              ("linux", "tmp/binary-repro/linux-a/linux-a.json", "tmp/binary-repro/linux-b/linux-b.json"),
              ("macos", "tmp/binary-repro/macos-a/macos-a.json", "tmp/binary-repro/macos-b/macos-b.json"),
          ]
          for platform, a_path, b_path in pairs:
              a = read(a_path)
              b = read(b_path)
              if not a.get("equal", False):
                  raise SystemExit(f"{platform} lane a local reproducibility check failed")
              if not b.get("equal", False):
                  raise SystemExit(f"{platform} lane b local reproducibility check failed")
              a_hash = a["run1"]["sha256"]
              b_hash = b["run1"]["sha256"]
              if a_hash != b_hash:
                  raise SystemExit(
                      f"{platform} cross-runner reproducibility mismatch: {a_hash} != {b_hash}"
                  )
          print("milestone3 binary reproducibility witness compare passed")
          PY
