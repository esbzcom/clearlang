[package]
name = "clg-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
autobins = false

[features]
default = []
rust-z3-lib = ["dep:z3", "dep:z3-sys"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clg-parser = { path = "../parser" }
clg-typer  = { path = "../typer" }
clg-ir     = { path = "../ir" }
clg-codegen-wasm = { path = "../codegen-wasm" }
clg-ast    = { path = "../ast" }
wasmtime = "15"
wasmtime-wasi = "15"
wasmparser = "0.219"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = { version = "0.11", default-features = false, features = ["std"] }
serde_bytes = "0.11"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
crypto-common = "0.1"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
time = { version = "0.3", features = ["formatting"] }
z3 = { version = "0.12", optional = true, default-features = false, features = ["static-link-z3"] }
z3-sys = { version = "0.8", optional = true, default-features = false, features = ["static-link-z3"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
once_cell = "1"
wat = "1"
serde_yaml = "0.9"

[[bin]]
name = "clg"
path = "src/main.rs"
