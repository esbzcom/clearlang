[package]
name = "clg-cli"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clg-parser = { path = "../parser" }
clg-typer  = { path = "../typer" }
clg-ir     = { path = "../ir" }
clg-codegen-wasm = { path = "../codegen-wasm" }
clg-ast    = { path = "../ast" }
wasmtime = "15"
wasmparser = "0.219"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = { version = "0.11", default-features = false, features = ["std"] }
serde_bytes = "0.11"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
once_cell = "1"

[[bin]]
name = "clg"
path = "src/main.rs"
