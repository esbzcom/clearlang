[package]
name = "clg-cli"
version = "0.1.0"
edition = "2021"
autobins = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clg-parser = { path = "../parser" }
clg-typer  = { path = "../typer" }
clg-ir     = { path = "../ir" }
clg-codegen-wasm = { path = "../codegen-wasm" }
wasmtime = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wasmparser = "0.219"
once_cell = "1"

[[bin]]
name = "clg"
path = "src/main.rs"
