[package]
name = "clg-codegen-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
wasm-encoder = "0.238"
anyhow = "1"
clg-ir = { path = "../ir" }

[dev-dependencies]
wasmtime = "15"
clg-parser = { path = "../parser" }
clg-typer  = { path = "../typer" }
once_cell = "1"
proptest = "1"
wasmparser = "0.219"
criterion = "0.5"

[[bench]]
name = "codegen"
harness = false
