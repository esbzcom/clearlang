[package]
name = "clg-typer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clg-ast = { path = "../ast" }
clg-ir  = { path = "../ir" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
clg-parser = { path = "../parser" }
criterion = "0.5"

[[bench]]
name = "typer"
harness = false
