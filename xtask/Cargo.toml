[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
clg-ast = { path = "../crates/ast" }
clg-typer = { path = "../crates/typer" }
